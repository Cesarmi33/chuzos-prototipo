# The repo root is the service root on purpose. apps/web/server.js loads
# prototypes/ and config/ via relative paths, and Render does not ship files
# outside rootDir.
services:
  - type: web
    name: chuzos-prototipo
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Persistencia: Internal Database URL de chuzos-db (Render Postgres free, vence a los 30 días).
      - key: DATABASE_URL
        fromDatabase:
          name: chuzos-db
          property: connectionString
      # Clave para bajar la lista de espera y reiniciar los datos demo.
      - key: ADMIN_KEY
        generateValue: true

databases:
  - name: chuzos-db
    plan: free
    region: oregon
    databaseName: chuzos_db
    user: chuzos_db_user
