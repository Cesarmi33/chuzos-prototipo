<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chuzos · prototipo demo</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#e8590c">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#fff8f0;color:#222;max-width:480px;margin:auto}
header{background:#e8590c;color:#fff;padding:10px 14px}header h1{margin:0;font-size:20px}
.banner{background:#ffe066;color:#5c4400;font-size:12px;padding:6px 14px;font-weight:600}
nav{display:flex}nav a{flex:1;text-align:center;padding:10px;background:#fff;color:#e8590c;text-decoration:none;font-weight:600;border-bottom:3px solid #eee}nav a.on{border-color:#e8590c}
#map{height:240px}.card{background:#fff;margin:10px;padding:12px;border-radius:12px;box-shadow:0 1px 4px #0002}
button{background:#e8590c;color:#fff;border:0;padding:9px 12px;border-radius:8px;font-weight:600;margin:3px 3px 0 0;cursor:pointer;white-space:nowrap}button.alt{background:#555}
.st{display:inline-block;padding:2px 8px;border-radius:10px;background:#d3f9d8;font-size:12px;font-weight:700}.muted{color:#777;font-size:13px}
.wallet{display:flex;gap:8px}.wallet div{flex:1;background:#fff4e6;border-radius:10px;padding:8px;text-align:center}.wallet b{font-size:22px;display:block}
.badge{background:#e8590c;color:#fff;border-radius:10px;padding:0 6px;font-size:12px;margin-left:4px}
.code{font-size:22px;letter-spacing:1px}
.pay{background:#f8f9fa;border-radius:8px;padding:8px;margin-top:8px;font-size:14px}
.note{font-size:13px;color:#5c4400;background:#fff3bf;padding:6px;border-radius:8px;margin:6px 0}
.chat{background:#fff8f0;border-radius:10px;padding:8px;margin-top:8px;max-height:260px;overflow:auto}
.msg{margin:6px 0;padding:6px 8px;border-radius:8px;background:#fff;font-size:14px}
.msg.system{background:#fff4e6}
.receipt{max-width:100%;border-radius:8px;margin-top:4px}
.row{display:flex;gap:6px;margin-top:6px;align-items:center}
.row input,.row select{flex:1;min-width:0;padding:8px;border:1px solid #ddd;border-radius:8px;font-size:16px}
</style></head><body>
<header><h1>🍢 Chuzos</h1><div class="muted" style="color:#ffe8cc">Pide a los puestos de tu barrio · pagas directo al vendedor</div></header>
<div class="banner">PROTOTIPO DEMO · Puestos, pedidos y ubicaciones son datos ficticios de prueba</div>
<nav><a href="#comprador" id="n-comprador">Comprador</a><a href="#puesto" id="n-puesto">Puesto</a><a href="#repartidor" id="n-repartidor">Repartidor</a></nav>
<main id="app"></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script></body></html>
